---
name: Bug report
description: Report reproducible incorrect behaviour.
title: "bug: "
labels: [bug, needs triage]
body:
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sanitized logs or screenshots only.
